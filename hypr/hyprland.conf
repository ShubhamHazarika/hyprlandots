monitor=,preferred,auto,1,mirror,DP-1

workspace=1,persistent:true
workspace=2,persistent:true
workspace=3,persistent:true
workspace=4,persistent:true
workspace=5,persistent:true



$terminal = kitty
$fileManager = nemo
#$menu = tofi-drun -c ~/.config/tofi/configA --drun-launch=true
$menu = rofi -show drun -show-icons  -c ~/.config/rofi/config.rassi 
$editor = code
$colorPicker = hyprpicker

exec-once=waybar & nm-applet --indicator 

exec-once = rm "$HOME/.cache/cliphist/db"    
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = while true; do ~/.config/hypr/touchpad-auto.sh; sleep 2; done
exec-once = awww-daemon 
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec-once = env GDK_BACKEND=x11 gsr-ui

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = LIBVA_DRIVER_NAME,radeonsi
env = __GLX_VENDOR_LIBRARY_NAME,mesa


env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
# env = QT_STYLE_OVERRIDE,kvantum

env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

#env = WLR_DRM_NO_ATOMIC=1

general { 
    gaps_in  = 2
    gaps_out = 3
    border_size = 2
    resize_on_border = true 
    allow_tearing = false
    layout = dwindle
    col.active_border    = rgb(547A95)
    col.inactive_border  = rgb(2C3947)	
}

dwindle {
}

animations {
    enabled   = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier # Reduced from default
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}



misc { 
    force_default_wallpaper = 0 
    disable_hyprland_logo = true 
    disable_splash_rendering = true
    vrr = 0
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.4 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
	disable_while_typing = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device[crq1080:00-0488:1014-touchpad] {
#    name = crq1080:00-0488:1014-touchpad
    sensitivity = 0.07
    scroll_factor=0.1
    natural_scroll=yes
    disable_while_typing = true
}

$mainMod = SUPER 

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, W, togglefloating,
bind = $mainMod, W, resizeactive, exact 1280 720
bind = $mainMod, W, centerwindow,
bind = $mainMod, R, exec, $menu
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30


bind = $mainMod, P, exec, $colorPicker | wl-copy 


bind = SUPER, L, exec, hyprlock

bind = SUPER, S, exec, hyprshot -s -z -o "/home/shubharch/Desktop/Hyprshot Screenshots" -m region  # current Active window only + clipboard copy
bind = SUPER, PRINT, exec, hyprshot -m output -o "/home/shubharch/Desktop/Hyprshot Screenshots" 

bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

bind = $mainMod , B , exec , ~/.config/hypr/scripts/wofi-swww

xwayland {
  force_zero_scaling = true
}

## TOUCHPAD GESTURES
##

gestures {
	gesture = 3, horizontal, workspace
	workspace_swipe_distance = 300
	workspace_swipe_invert = true
	
	gesture = 3, down, mod: ALT, close
	gesture = 4, left, dispatcher , movetoworkspacesilent, e+1
	gesture = 4, right,dispatcher , movetoworkspacesilent, e-1
	workspace_swipe_distance = 200
}


decoration {
	rounding = 20
	blur {
		enabled = true
		size    = 3
		passes  = 1
		}
}


